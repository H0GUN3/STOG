spring:
  application:
    name: stog-backend
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

stog:
  auth:
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    naver-ticket-ttl: 5m
    random-token-bytes: 32
  google:
    web-client-id: ${GOOGLE_WEB_CLIENT_ID:}
    places:
      api-key: ${GOOGLE_PLACES_API_KEY:}
      base-url: ${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com/v1}
      default-language-code: ${GOOGLE_PLACES_LANGUAGE_CODE:ko}
      default-region-code: ${GOOGLE_PLACES_REGION_CODE:KR}
    routes:
      api-key: ${GOOGLE_ROUTES_API_KEY:}
      base-url: ${GOOGLE_ROUTES_BASE_URL:https://routes.googleapis.com}
  ai:
    base-url: ${STOG_AI_BASE_URL:https://stog-preference-chat-qoeu5cmuxq-as.a.run.app}
    timeout: ${STOG_AI_TIMEOUT:30s}
  catalog:
    search:
      result-limit: ${CATALOG_SEARCH_RESULT_LIMIT:20}
      fallback-min-results: ${CATALOG_SEARCH_FALLBACK_MIN_RESULTS:3}
      fuzzy-threshold: ${CATALOG_SEARCH_FUZZY_THRESHOLD:0.25}
      default-radius-meters: ${CATALOG_SEARCH_DEFAULT_RADIUS_METERS:3000}
      nearby-duplicate-distance-meters: ${CATALOG_SEARCH_NEARBY_DUPLICATE_DISTANCE_METERS:50}
  events:
    nearby:
      default-radius-meters: ${EVENT_NEARBY_DEFAULT_RADIUS_METERS:10000}
      result-limit: ${EVENT_NEARBY_RESULT_LIMIT:10}
      horizon-days: ${EVENT_NEARBY_HORIZON_DAYS:90}
  storage:
    bucket: ${GCS_BUCKET:}
    signed-url-ttl: ${GCS_SIGNED_URL_TTL:}
    signer-service-account: ${GCS_SIGNER_SERVICE_ACCOUNT:}
    original-max-size: ${GCS_ORIGINAL_MAX_SIZE:2MB}
    thumbnail-max-size: ${GCS_THUMBNAIL_MAX_SIZE:50KB}
  set-log:
    caption-max-code-points: ${SET_LOG_CAPTION_MAX_CODE_POINTS:120}
    location-max-accuracy-meters: ${SET_LOG_LOCATION_MAX_ACCURACY_METERS:100}
    place-radius-meters: ${SET_LOG_PLACE_RADIUS_METERS:75}
    place-tie-delta-meters: ${SET_LOG_PLACE_TIE_DELTA_METERS:10}
  social:
    feed:
      page-size: ${FEED_PAGE_SIZE:20}
  cell:
    summary-page-size: ${CELL_SUMMARY_PAGE_SIZE:20}
    photo-page-size: ${CELL_PHOTO_PAGE_SIZE:20}
  visit:
    dwell: ${VISIT_DWELL:30m}
    walk-speed-limit-kmh: ${WALK_SPEED_LIMIT_KMH:6}
    late-grace: ${LATE_VISIT_GRACE:24h}
