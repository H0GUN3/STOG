meta:
  document: architecture
  project: STOG
  version: 0.1
  authority: canonical
  depends_on: [glossary.yaml, product.yaml]
  description: >-
    STOG를 무엇으로 어떻게 만드는가에 대한 단일 기준.
    용어는 glossary.yaml, 기능 정의와 우선순위는 product.yaml을 따른다.
  rules:
    - 스키마와 API를 바꾸려면 이 문서를 먼저 고친다
    - 튜닝 가능한 숫자는 product.yaml의 tuning_parameters에만 둔다
    - 여기에 없는 라이브러리나 서비스를 임의로 추가하지 않는다

stack:
  app:
    platform: Android 단독
    language: Kotlin
    ui: Jetpack Compose
    local_db: Room
    map: Google Maps SDK for Android
    h3: h3-java
    rationale:
      - Google이 Kotlin 우선을 선언했고 Compose는 Kotlin 전용이라 화면 개발 속도가 빠르다
      - 백그라운드 위치 수집과 센서 접근이 핵심 기능이라 플러그인 계층 없이 직접 제어해야 한다
      - h3-java를 서버와 공유해 셀 판정 로직을 양쪽에서 동일하게 유지한다
    rejected:
      - {option: Flutter, reason: 위치와 배터리 정책 제어가 플러그인에 의존}
      - {option: React Native, reason: 동일}
      - {option: iOS 동시 개발, reason: 4주 단독 개발로 불가능}

  api_server:
    language: Kotlin
    framework: Spring Boot
    rationale:
      - 앱과 언어가 같아 단독 개발자의 컨텍스트 전환 비용이 없고 DTO를 그대로 공유한다
      - 트랜잭션 롤백과 타임아웃이 프레임워크 기본 기능이라 직접 구현하지 않는다
      - 서버 작업이 대부분 I/O 대기라 언어 실행 속도가 병목이 아니다
    rejected:
      - {option: Ktor, reason: 가볍지만 참고 자료가 적어 단독 개발 시 막히면 손실이 큼}
      - {option: Node.js, reason: 앱과 언어가 달라 공유 이점이 사라짐}

  ai_server:
    status: undecided
    question: AI 기능을 독립 서비스로 개발하고 배포할지 API 서버와 같은 실행 단위에 둘지 미정이다
    independent_candidate:
      language: Python
      framework: FastAPI
      h3: h3-py
      rationale:
        - AI 담당 2명이 독립적으로 개발할 수 있다
        - 팀 분업선과 실행 경계를 맞출 수 있다
      boundary_if_selected:
        - AI 서버는 DB를 읽기만 한다
        - 쓰기는 API 서버 API를 통해서만 수행한다
    rule:
      - A-03이 결정되기 전에는 독립 AI 서버를 확정 전제로 구현하지 않는다
      - 알고리즘의 입력과 출력 계약은 실행 경계와 분리해 정의한다

  database:
    engine: PostgreSQL
    hosting: Cloud SQL
    postgis: false
    postgis_rationale: >-
      좌표에서 셀을 얻는 것은 H3의 순수 계산이고 셀 조회는 정수 비교다.
      반경 검색은 gridDisk 이웃 탐색으로 대체하고 정확한 거리가 필요하면 후보 수십 건을 코드에서 계산한다.
      임의 폴리곤 포함 판정이나 도형 교차가 필요해지면 그때 확장을 켠다.

infrastructure:
  provider: Google Cloud
  services:
    - {name: Cloud Run, use: API 서버와 독립 배포를 선택한 경우의 AI 서버, note: 무요청 시 인스턴스 0으로 축소}
    - {name: Cloud SQL, use: PostgreSQL}
    - {name: Cloud Storage, use: 사진 원본과 썸네일}
    - {name: Cloud Build, use: main 머지 시 자동 빌드}
    - {name: Artifact Registry, use: 컨테이너 이미지}
  not_used:
    - {name: Memorystore, reason: 앱 로컬 캐시로 충분}
    - {name: Cloud CDN, reason: 데모 규모에서 불필요}
    - {name: Pub/Sub, reason: 비동기 큐가 필요한 흐름이 없음}
  local_dev:
    database: Docker PostgreSQL
    storage: 실제 GCS 개발용 버킷
    storage_rationale: 로컬 파일시스템을 쓰면 서명 URL 흐름을 검증할 수 없고 그 부분이 배포 후 가장 자주 깨진다
  demo_note: 심사 직전 Cloud Run 최소 인스턴스를 1로 올려 콜드 스타트를 제거한다

database_schema:
  conventions:
    id: BIGSERIAL
    cell_id: BIGINT
    cell_id_rationale: H3 셀 인덱스는 64비트 정수다. 16진 문자열로 저장하면 인덱스가 커지고 비교가 느려진다
    cell_id_boundary: API 응답과 요청에서는 16진 문자열로 직렬화한다. glossary.yaml의 cell_id representation을 따른다
    timestamps: TIMESTAMPTZ
    coords: 모든 공간 데이터는 cell_id와 함께 lat, lng를 저장한다

  tables:
    - name: users
      columns: [id, nickname, traveler_type, axis_scores jsonb, mobility_style, honey_balance, created_at]
      note: 로그인 제공자와 무관한 사용자 프로필이다. axis_scores는 6축 점수를 담고 honey_balance는 원장 합계의 캐시다

    - name: auth_accounts
      columns: [id, user_id, provider, provider_user_id, password_hash, created_at]
      enums:
        provider: [local, google, kakao, naver]
      nullable: [password_hash]
      indexes: ["(provider, provider_user_id) UNIQUE"]
      constraints:
        - local 계정은 password_hash가 필수이고 소셜 계정은 null이다
      note: >-
        모든 로그인 수단을 같은 구조로 저장한다. provider_user_id는 local이면 소문자로 정규화한 이메일이고,
        소셜 로그인이면 제공자가 반환한 사용자 식별자다. 비밀번호 원문은 저장하지 않는다

    - name: trips
      columns: [id, owner_id, title, activity_type, mode, visibility, is_group, planned_start_date, planned_end_date, started_at, ended_at, created_at]
      enums:
        activity_type: [walk, run, date, tour, etc]
        mode: [active, dormant, ended]
        visibility: [private, group, public]
      note: >-
        activity_type은 여행 단위 속성이다. 구간 분할하지 않는다.
        그룹 여행에서는 owner_id가 그룹장이며 초대 링크 생성과 참여자 삭제 권한의 단일 기준이다

    - name: trip_members
      columns: [trip_id, user_id, joined_at, left_at]
      pk: [trip_id, user_id]
      note: >-
        role 컬럼을 두지 않는다. 그룹장은 trips.owner_id로 판정한다.
        그룹장과 참여자는 일정 바구니 추가와 여행 일정 수정 권한이 같다

    - name: visits
      columns: [id, trip_id, cell_id, lat, lng, entered_at, left_at, status, is_interpolated]
      enums:
        status: [passed, visited]
      indexes: ["(cell_id)", "(trip_id, entered_at)"]
      note: is_interpolated가 true면 방문 판정과 쿠폰 대상에서 제외한다

    - name: photos
      columns: [id, trip_id, user_id, source, cell_id, lat, lng, taken_at, original_key, thumb_key, caption, like_count, is_public, created_at]
      enums:
        source: [camera, gallery]
      nullable: [cell_id, lat, lng]
      indexes: ["(cell_id, like_count DESC)", "(trip_id)", "(user_id)"]
      note: >-
        저장본과 썸네일 두 벌의 객체 키를 갖는다. 원본은 기기 갤러리에만 남고 서버로 올라오지 않는다.
        like_count는 likes 집계의 캐시이며 셀 대표 사진 선정에 사용한다.
        갤러리 업로드 사진은 EXIF 좌표가 없으면 cell_id가 null이며 지도에 표시되지 않고 여행 사진첩에만 남는다

    - name: places
      columns: [id, name, category, lat, lng, cell_id, source, external_id, accessibility jsonb, created_at]
      enums:
        source: [kakao, naver, public_data, user]
      indexes: ["(cell_id)", "(lat, lng)"]
      note: accessibility는 무장애 정보다. 셀 배지가 아니라 장소 카드에 표시한다

    - name: basket_items
      columns: [id, trip_id, added_by, item_type, place_id, source, original_url, title, thumbnail_url, category, lat, lng, cell_id, status, added_at]
      enums:
        item_type: [place, link]
        status: [resolved, manual, unresolved]
      note: 검색으로 담은 장소와 공유 담기로 들어온 링크 블록을 한 테이블에 담아 조인을 줄인다

    - name: itinerary_items
      columns: [id, trip_id, basket_item_id, day_number, order_index, planned_arrival, planned_duration_min]
      indexes: ["(trip_id, day_number, order_index)"]

    - name: itinerary_changes
      columns: [id, trip_id, user_id, action, payload jsonb, created_at]
      indexes: ["(trip_id, created_at DESC)"]
      note: >-
        append only다. payload에 변경 전후 값을 남겨 그룹 여행 참여자가 변경 이력을 조회할 수 있게 한다

    - name: cell_stats
      columns: [cell_id, visit_count, photo_count, photo_like_count, trip_like_count, top_photo_id, is_hot, updated_at]
      pk: [cell_id]
      note: >-
        불타는 셀 판정은 photo_like_count와 visit_count만 사용한다.
        top_photo_id는 그 셀에서 좋아요가 가장 많은 사진이며 셀 위 대표 사진으로 표시한다.
        대표 사진이 바뀌는 것은 파일을 새로 만드는 것이 아니라 가리키는 대상을 바꾸는 것이다

    - name: likes
      columns: [user_id, target_type, target_id, created_at]
      pk: [user_id, target_type, target_id]
      enums:
        target_type: [trip, photo]
      indexes: ["(target_type, target_id)"]
      note: 복합 기본키가 고유 사용자 좋아요를 보장한다. 여행 동선과 사진 게시물이 같은 구조를 공유한다

    - name: partners
      columns: [id, name, cell_id, lat, lng, daily_quota, coupon_title, coupon_value, dwell_required_min, active]

    - name: coupons
      columns: [id, partner_id, user_id, issued_date, honey_cost, barcode, issued_at, expires_at, redeemed_at, status]
      enums:
        status: [issued, redeemed, expired, rolled_back]
      constraints: ["UNIQUE (partner_id, user_id, issued_date)"]
      indexes: ["(user_id, issued_at)", "(partner_id, issued_date)"]
      note: >-
        하루 1회 제한은 전역이 아니라 제휴처별이다. 사용자는 같은 날 서로 다른 제휴처에서 각각 1장을 받을 수 있다.
        UNIQUE 제약이 이를 DB 수준에서 보장하므로 애플리케이션 로직에 의존하지 않는다.
        그룹 여행에서도 쿠폰은 개인 소유다. 참여자가 각자 체류 조건을 충족해야 각자 발급된다.
        barcode는 매장에서 제시하는 값이다

    - name: honey_ledger
      columns: [id, user_id, delta, reason, ref_id, created_at]
      note: 잔액을 직접 수정하지 않고 증감 기록만 남긴다. 롤백은 반대 부호 행을 추가하는 것으로 처리한다

    - name: street_candidates
      columns: [id, name, "cell_ids BIGINT[]", poi_density, status, created_at]
      enums:
        status: [candidate, named, retired]

    - name: street_name_votes
      columns: [street_id, user_id, proposed_name, created_at]
      pk: [street_id, user_id]

    - name: behavior_events
      columns: [id, user_id, event_type, raw_text, axis, created_at]
      enums:
        event_type: [search, basket_add, like, visit]
      indexes: ["(user_id, created_at DESC)"]
      note: 성향 갱신은 최근 50건만 조회한다

    - name: events
      columns: [id, title, cell_id, lat, lng, start_date, end_date, source, detail_url]
      indexes: ["(cell_id)", "(start_date)"]

api:
  style: REST
  serialization:
    - key: cell_id
      wire_type: 16진 문자열
      db_type: BIGINT
      rule: 컨트롤러 경계에서 h3ToString과 stringToH3로 변환한다
      why: >-
        JSON 숫자의 안전 정수 상한은 2의 53승 약 9곱하기10의15승이다.
        해상도 10의 셀 값은 약 6곱하기10의17승으로 그보다 70배 크다.
        숫자로 직렬화하면 자바스크립트 계열 클라이언트에서 오류 없이 끝자리만 손실된다
    - key: id
      wire_type: 숫자
      note: BIGSERIAL 값은 안전 정수 범위 안에 머무르므로 변환하지 않는다
  auth:
    method: 앱 자체 로그인과 소셜 로그인 병행, 자체 JWT 발급
    providers: [local, google, kakao, naver]
    order: [local, google, kakao, naver]
    order_rationale: >-
      제공자마다 개발자 등록과 키 발급 절차가 따로 있다.
      자체 로그인을 먼저 두면 심사용 계정을 미리 만들어 둘 수 있고 소셜 연동 지연에 막히지 않는다.
      안드로이드에서 구글이 가장 빨리 붙고 카카오는 국내 실사용률이 높다.
      네이버는 마지막에 추가해도 P0에 지장이 없다
    common_result:
      - 서버가 auth_accounts의 provider와 provider_user_id로 사용자를 찾거나 생성한다
      - 로그인 성공 시 모든 제공자에 동일한 자체 JWT를 발급한다

    local:
      scope: 최소안
      included: [회원가입, 로그인, 토큰 갱신]
      excluded: [비밀번호 재설정, 이메일 인증]
      excluded_rationale: >-
        메일 발송 서비스 연동과 템플릿과 토큰 만료 처리가 따라온다.
        P0가 아닌 곳에 4주 일정을 쓰지 않는다
      ux_note: 회원가입 화면에 비밀번호를 잊으면 소셜 로그인을 이용하라고 안내한다
      password_hash: BCrypt
      app_sends: [email, password]
      server_verify: >-
        이메일의 앞뒤 공백을 제거하고 소문자로 정규화해 provider_user_id로 조회한 뒤 BCrypt 해시를 비교한다
      storage:
        provider: local
        provider_user_id: 정규화한 이메일
        password_hash: BCrypt 결과
      signup_transaction: users와 auth_accounts를 한 트랜잭션으로 생성한다

    google:
      app_sdk: Credential Manager
      app_sdk_note: 기존 Google Sign-In SDK는 지원 종료 수순이다. 오래된 예제를 따라가면 deprecated API를 쓰게 된다
      app_receives: ID 토큰 (JWT)
      server_verify: 구글 공개키로 JWT 서명을 직접 검증한다
      provider_user_id: 검증된 ID 토큰의 sub
      verify_note: 네트워크 왕복이 없어 카카오나 네이버보다 빠르고 외부 API 타임아웃 대상이 아니다
      keys_required: [Android용 OAuth 클라이언트 ID, 서버용 OAuth 클라이언트 ID]

    kakao:
      app_sdk: Kakao SDK for Android
      app_receives: 액세스 토큰
      server_verify: GET kapi.kakao.com/v2/user/me 에 Bearer 토큰으로 조회
      provider_user_id: 검증 응답의 사용자 id
      keys_required: [네이티브 앱 키, 키 해시]
      pitfall: 디버그 빌드와 릴리스 빌드의 키 해시가 다르다. 둘 다 콘솔에 등록하지 않으면 개발 중에는 되고 배포하면 실패한다

    naver:
      app_sdk: Naver Login SDK for Android
      app_receives: 액세스 토큰
      server_verify: GET openapi.naver.com/v1/nid/me 에 Bearer 토큰으로 조회
      provider_user_id: 검증 응답의 사용자 id
      keys_required: [Client ID, Client Secret]
      secret_rule: Client Secret은 서버에만 둔다

    secret_rule: 모든 시크릿 키는 서버에만 둔다. APK에 넣지 않는다
    verify_before_build: 각 제공자의 공식 문서에서 엔드포인트와 응답 형식을 착수 전에 확인한다
  groups:
    - group: 인증
      endpoints:
        - {path: "POST /auth/signup", body: [email, password, nickname], note: 자체 로그인 가입}
        - {path: "POST /auth/login", body: [email, password], note: 자체 로그인}
        - {path: "POST /auth/social", body: [provider, token], note: "provider는 google, kakao, naver 중 하나. 서버가 검증 후 가입 또는 로그인을 함께 처리한다"}
        - {path: "POST /auth/refresh", body: [refresh_token]}
        - {path: "POST /auth/logout"}
        - {path: "GET /me"}

    - group: 셀
      endpoints:
        - {path: "GET /cells", query: "swLat, swLng, neLat, neLng", note: "좌표 범위로 조회하고 결과를 cell_id로 묶는다. polyfill 후 IN 절을 쓰지 않는다"}
        - GET /cells/{cellId}
        - GET /cells/{cellId}/photos

    - group: 여행
      permissions:
        owner_only: [초대 링크 생성, 참여자 삭제]
        all_members: [일정 바구니 추가, 여행 일정 수정, 변경 이력 조회]
      endpoints:
        - POST /trips
        - GET /trips/{id}
        - PATCH /trips/{id}/mode
        - POST /trips/{id}/visits
        - {path: "POST /trips/{id}/invite-links", note: "그룹장만 호출한다. 링크 만료 정책은 A-05 결정 후 확정한다"}
        - {path: "POST /trip-invites/{token}/join", note: "로그인한 사용자가 초대 링크로 참여한다"}
        - {path: "DELETE /trips/{id}/members/{userId}", note: "그룹장만 다른 참여자를 삭제한다"}
        - {path: "DELETE /trips/{id}/members/me", note: "참여자가 나간다. 그룹장 이탈 처리는 A-04 결정 전 구현하지 않는다"}
        - GET /trips/me

    - group: 사진
      endpoints:
        - {path: "POST /photos/upload-url", note: "서명 URL 2개를 발급한다. 사진은 서버를 지나가지 않는다"}
        - {path: "POST /photos", note: "업로드 완료 후 메타데이터만 저장한다"}
        - PATCH /photos/{id}/visibility

    - group: 계획
      endpoints:
        - GET /places/search
        - {path: "POST /basket-items", note: "그룹 여행에서는 모든 참여자가 검색 또는 공유 담기로 추가할 수 있다"}
        - {path: "POST /basket-items/{id}/resolve", note: "일정 배치 시점에 지도 검색으로 좌표를 매핑한다"}
        - GET /trips/{id}/basket
        - {path: "PUT /trips/{id}/itinerary", note: "그룹 여행에서는 모든 참여자가 수정할 수 있고 itinerary_changes에 기록한다"}
        - {path: "GET /trips/{id}/itinerary/changes", note: "그룹 여행 참여자가 변경 이력을 조회한다"}
        - POST /itinerary/validate

    - group: 소셜
      endpoints:
        - GET /feed
        - POST /trips/{id}/like
        - DELETE /trips/{id}/like
        - POST /trips/{id}/copy

    - group: 리워드
      endpoints:
        - GET /partners/nearby
        - POST /coupons/issue
        - POST /coupons/{id}/redeem
        - GET /honey/balance

    - group: 성향
      endpoints:
        - GET /survey
        - POST /survey/submit
        - GET /profile/type

    - group: 행사
      endpoints:
        - GET /events
        - GET /events/{id}

algorithms:
  - id: ALG-01
    name: 셀 판정
    where: 앱
    method: latLngToCell로 셀을 구하고 직전 셀과 다르면 연속 확인 후 전환으로 인정
    uses: [cell_transition_confirm, location_distance_filter_m]
    complexity: O(1)
    note: 모든 GPS 점을 서버로 보내지 않는다. 8시간 여행 기준 수천 건이 수십 건으로 줄어든다

  - id: ALG-02
    name: 방문 판정
    where: 서버
    method: 목표 셀에서 체류 시간이 임계값을 넘으면 visited, 셀을 벗어나면 passed
    uses: [visit_dwell_minutes]
    complexity: O(1)
    test: 필수. 순수 함수로 분리한다

  - id: ALG-03
    name: 동선 보간
    where: 서버
    method: 연속 두 지점의 평균 속도가 임계값 이하면 실선 보간, 초과하면 점선 처리 후 방문과 쿠폰에서 제외
    uses: [walk_speed_limit_kmh]
    complexity: O(n)
    note: 전북에 지하 구간이 없어 터널 판별이 필요 없다

  - id: ALG-04
    name: 주변 후보 검색
    where: 서버
    method: gridDisk로 이웃 셀을 구하고 해당 셀에 속한 장소를 조회한 뒤 필요하면 코드에서 거리 정렬
    complexity: O(k²)
    note: PostGIS 반경 검색을 대체한다

  - id: ALG-05
    name: 거리 군집 추출
    where: AI 담당 배치, 실행 경계는 A-03에서 결정
    method: 상가업소 좌표를 셀로 집계하고 밀도 임계값을 넘는 인접 셀을 gridDisk로 연결
    complexity: O(n + c·k)
    priority: P3
    note: 실시간 연산이 아니라 사전 계산이다

  - id: ALG-06
    name: 성향 점수 산출
    where: 서버
    method: 선택형과 공감도를 각각 0에서 1로 정규화한 뒤 가중 합산하고 상위 2축을 조합한다
    weights: 선택형 0.7, 공감도 0.3
    complexity: O(1)
    test: 필수

  - id: ALG-07
    name: 성향 자동 갱신
    where: AI 담당, 실행 경계와 쓰기 경로는 A-03에서 결정
    method: 최근 행동 이벤트를 축으로 분류해 집계하고 설문 점수와 가중 합산한다
    uses: [profile_behavior_weight, profile_window_size]
    complexity: O(w)
    note: 유형이 바뀌면 사용자에게 알리고 되돌리기를 제공한다

  - id: ALG-08
    name: 일정 실현 가능성 검증
    where: AI 담당, 실행 경계는 A-03에서 결정
    method: 항목 간 이동시간과 체류시간의 합을 가용 시간과 비교해 초과분을 찾고 제거 후보를 제안한다
    complexity: O(n)
    note: 순서 최적화는 제약조건 알고리즘, 제거 제안 문구는 생성형 AI가 맡는다

ai_modules:
  principle: 기능별 모듈과 입출력 계약을 먼저 분리하고 독립 서비스 여부는 A-03에서 결정한다
  modules:
    - {id: AI-01, name: 일정 검증과 동선 생성, type: 알고리즘 + 생성형}
    - {id: AI-02, name: 취향 기반 장소 정렬, type: 규칙 기반 스코어링, note: 사용자 데이터가 없는 초기에는 학습 모델을 쓰지 않는다}
    - {id: AI-03, name: 추천 이유 생성, type: 생성형}
    - {id: AI-04, name: 행동 이벤트 축 분류, type: 생성형, note: 검색어 하나당 토큰이 적어 비용 부담이 낮다}
    - {id: AI-05, name: 여행 요약 응답, type: 생성형, note: 어디를 여행했는지 수준까지만 생성한다}

external_apis:
  items:
    - {name: 카카오 로컬, use: 장소 키워드 검색과 좌표 획득, timeout_s: 3}
    - {name: 네이버 지도, use: 장소 검색 보조, timeout_s: 3}
    - {name: ODsay, use: 대중교통 경로, timeout_s: 3}
    - {name: 공공데이터 문화재 관광지, use: 아이콘 배지 셀, timeout_s: 3, cache: 정적 데이터라 주기적 동기화 후 자체 DB에서 조회}
    - {name: 공공데이터 상가업소, use: 거리 군집 추출, timeout_s: 배치}
    - {name: 공공데이터 지역 행사, use: 행사 페이지, timeout_s: 3, cache: 일 1회 동기화}
    - {name: 한국관광공사 무장애 정보, use: 장소 접근성 표시, timeout_s: 배치}
    - {name: 기상청 단기예보, use: 날씨 규칙 엔진, timeout_s: 3}
    - {name: 카카오 사용자 정보, endpoint: kapi.kakao.com/v2/user/me, use: 소셜 로그인 토큰 검증, timeout_s: 3}
    - {name: 네이버 사용자 정보, endpoint: openapi.naver.com/v1/nid/me, use: 소셜 로그인 토큰 검증, timeout_s: 3}
  policy:
    - 정적이거나 변동이 느린 공공데이터는 실시간 호출하지 않고 동기화해 자체 DB에서 조회한다
    - 외부 API 실패는 기능 전체를 막지 않는다. 캐시값이나 빈 결과로 응답한다

trip_mode_transitions:
  uses: [dormant_after_minutes]
  rules:
    - {from: none, to: active, trigger: 일정 시작일 도래 또는 하단 중앙 버튼}
    - {from: active, to: dormant, trigger: 셀 전환 없이 임계 시간 경과, notify: false}
    - {from: active, to: dormant, trigger: 배터리 15퍼센트 이하, notify: true}
    - {from: dormant, to: active, trigger: 저전력 움직임 감지}
    - {from: any, to: ended, trigger: 일정 종료일 자정, notify: true}
  note: dormant 진입 시 알림을 보내지 않는다. 카페나 전시 관람 중 반복 알림이 된다

resilience:
  timeouts:
    - {target: 외부 지도 및 공공데이터, seconds: 3, on_fail: 캐시값 또는 빈 결과}
    - {target: AI 실행 경계, seconds: 15, on_fail: 앱에 로딩 표시, 동기 대기 금지, note: 독립 서비스 선택 시 적용}
    - {target: 위치 전송, seconds: 2, on_fail: 앱 로컬 큐에 보관 후 재전송}
  offline:
    rule: 위치는 앱 로컬 DB에 먼저 저장하고 서버 전송은 그 다음이다
    rationale: 네트워크가 끊겨도 여행 기록에 구멍이 생기면 안 된다
  rollback:
    - {case: 쿠폰 사용, method: 꿀 차감과 사용 확정을 한 트랜잭션으로 묶는다, note: 실패 시 원장에 반대 부호 행을 추가한다}
    - {case: 사진 업로드, order: GCS 업로드 성공 후 DB 삽입, note: 순서를 뒤집으면 존재하지 않는 사진을 가리키는 레코드가 생긴다}
  idempotency:
    - 위치 전송과 쿠폰 발급은 클라이언트 생성 키를 받아 중복 요청을 무시한다

performance:
  map_rendering:
    - 지도 idle 이벤트에서만 조회한다. 드래그와 핀치 중에는 요청하지 않는다
    - 디바운스 300ms
    - 조회한 영역은 캐시해 되돌아왔을 때 재요청하지 않는다
    - 줌 12 이하에서는 셀 레이어를 끄고 클러스터 마커로 전환한다
  photo:
    - 피드는 썸네일만 사용한다
    - 원본은 상세 보기와 인스타 내보내기에서만 로드한다

complexity_estimate:
  note: 대회 데모 규모 기준 추정치다
  rows:
    - {table: visits, per_trip: 수십 건, reason: 셀 전환 시에만 행이 생긴다}
    - {table: photos, per_trip: 10에서 50건}
    - {table: cell_stats, total: 콘텐츠가 생긴 셀 수만큼}
    - {table: places, total: 공공데이터 동기화분 + 검색 결과 캐시}
  hot_paths:
    - {path: "GET /cells", frequency: 최다, mitigation: 좌표 범위 인덱스와 앱 캐시}
    - {path: "POST /trips/{id}/visits", frequency: 여행 중 수십 회, mitigation: 앱에서 셀 전환만 걸러 전송}

media:
  photo:
    aspect_ratio: "4:3"
    aspect_rationale: 규격을 하나로 고정해 화면과 내보내기 처리 분기를 없앤다
    stored:
      - {kind: original, size: 2048x1536, format: JPEG, quality: 85, approx_size: 1에서 2MB, use: 상세 보기와 인스타그램 내보내기}
      - {kind: thumbnail, size: 640x480, format: JPEG, approx_size: 50KB, use: 피드와 보관함과 셀 표시}
    resize_where: 앱에서 촬영 직후 또는 갤러리 선택 직후 두 장을 만들어 업로드한다
    resize_rationale:
      - 여행 중 LTE 업로드에서 가장 큰 제약은 서버 CPU가 아니라 사용자의 데이터 요금이다
      - 앱에서 줄이면 장당 1에서 2MB, 원본을 올리면 8에서 12MB다
      - 안드로이드 기본 API로 처리되며 추가 라이브러리가 필요 없다
    device_copy:
      save_to_gallery: false
      method: 사용자가 다운로드 버튼을 눌러 기기에 저장한다
      where:
        - 촬영 화면에서 촬영 직후
        - 보관함에서 지난 사진을 볼 때
      downloaded_size: 2048x1536 저장본
      downloaded_size_rationale: >-
        원본 4000x3000은 서버로 올라가지 않으므로 나중 다운로드에는 존재하지 않는다.
        촬영 직후와 나중 다운로드가 서로 다른 크기를 주면 사용자가 혼란스럽고 코드도 갈라진다.
        2048은 인스타그램 1080의 두 배라 실사용에 충분하다
      tradeoff: 다운로드하지 않은 사진의 원본 화질은 보존되지 않는다. 촬영 화면에서 다운로드를 유도한다
    share_export:
      not_api: Instagram Graph API를 사용하지 않는다
      not_api_rationale:
        - Graph API 콘텐츠 게시는 비즈니스 또는 크리에이터 계정과 연결된 페이스북 페이지를 요구한다
        - Basic Display API가 2024년 12월 종료되어 개인 계정은 API 접근 자체가 없다
        - Meta 앱 심사가 제출 한 건당 2에서 4주 걸린다. 4주 일정에 들어갈 수 없다
        - 인텐트는 OS 기능이라 계정 종류 제한도 심사도 없다
      our_role: 파일을 넘기는 것까지다. 게시는 사용자가 인스타그램 앱에서 직접 한다
      what_transfers:
        yes: [이미지 파일]
        no: [캡션, 위치 태그, 해시태그, 계정 태그]
        note: 인스타그램은 갤러리에서 고른 사진과 구분하지 못한다. STOG에서 보냈다는 흔적이 남지 않는다
      paths:
        - id: feed
          priority: P1
          action: ACTION_SEND
          package: com.instagram.android
          app_id_required: false
          result: 인스타그램 편집 화면에 이미지가 로드된 상태로 열린다. 사용자가 편집 후 게시한다
        - id: story
          priority: P2
          action: com.instagram.share.ADD_TO_STORY
          package: com.instagram.android
          app_id_required: true
          app_id_note: source_application 엑스트라에 Facebook App ID를 넣는다. 콘솔 등록만 필요하고 앱 심사와는 다르다
          detail: 배경 이미지와 스티커 레이어를 분리해 보낼 수 있다
          risk: 기기와 버전에 따라 크래시나 빈 카메라 화면이 보고된 사례가 있다
          fallback: 실패 시 ACTION_SEND로 넘긴다. 인스타그램이 자체 화면에서 스토리 추가 선택지를 제공한다
      requirements:
        - id: fileprovider
          rule: FileProvider로 content URI를 만든다
          why: 안드로이드 7부터 file URI를 다른 앱에 넘기면 FileUriExposedException으로 크래시한다
        - id: uri_permission
          rule: FLAG_GRANT_READ_URI_PERMISSION을 걸고 queryIntentActivities로 찾은 패키지에 grantUriPermission을 호출한다
          why: 플래그만으로는 인스타그램이 파일을 읽지 못하는 경우가 있다
        - id: clipdata
          rule: setClipData도 함께 설정한다
          why: 공유 시트 미리보기는 EXTRA_STREAM이 아니라 ClipData를 참조한다
        - id: preflight
          rule: 인스타그램 설치 여부를 미리 확인하고 미설치 시 안내한다
      android_limitation: 안드로이드에서는 캡션을 코드로 미리 채울 수 없다. iOS와 달리 넘긴 텍스트를 인스타그램이 무시한다
      branding_note: 워터마크를 이미지에 합성하지 않으면 인스타그램에 STOG 흔적이 남지 않는다
      instagram_post: 2048x1536 저장본을 넘긴다
      instagram_story: 내보내기 시점에 앱에서 9대16 캔버스 가운데 배치하고 상하를 검게 채운다
      story_rationale: 미리 만들어 저장하면 사용하지 않는 파일이 용량만 차지한다
    size_rationale: >-
      인스타그램은 업로드 시 1080px로 압축한다.
      2048px은 그 두 배라 크롭하거나 비율을 바꿔도 화질이 남는다.
      안드로이드 화면 폭이 대부분 1080px이라 상세 보기에도 충분하다
    rejected:
      - option: Cloud Run Functions 리사이즈
        reason: >-
          함수는 GCS 도착 후 실행되므로 앱이 원본을 그대로 올려야 한다.
          업로드 용량 문제가 해결되지 않고 썸네일 생성이 비동기라 직후 몇 초간 이미지가 없다
        revisit_when: [원본 보관이 필요해질 때, 저장 규격이 3개 이상이 될 때, iOS를 추가해 리사이즈 코드가 중복될 때]
      - option: 4K 원본 보관
        reason: 50장 여행이면 500MB에 이른다
      - option: Cloud CDN
        reason: >-
          데모 규모에서는 캐시 히트가 거의 없고 HTTP 로드밸런서 고정 요금이 발생한다.
          버킷을 서울 리전에 두고 피드에 썸네일만 쓰면 체감 차이가 없다
        revisit_when: [실사용 트래픽이 발생한 뒤]
        note: 나중에 버킷 앞에 로드밸런서를 끼우면 되므로 데이터 마이그레이션 부담이 없다
  storage:
    bucket_region: asia-northeast3
    region_rationale: 국내 사용자 대상이므로 서울 리전이 지연을 가장 낮춘다

data_sync:
  principle: 변동 속도에 따라 다운로드와 실시간 호출을 나눈다
  static_download:
    note: 스케줄링하지 않는다. 로컬 적재 스크립트를 한 번 실행한다
    datasets:
      - 문화재와 박물관과 관광지
      - 소상공인시장진흥공단 상가업소 정보
      - 한국관광공사 무장애 정보
    benefit: 아이콘 배지 셀을 cell_id로 바로 조회할 수 있어 화면 조회 쿼리 하나에 딸려 나온다
  scheduled:
    trigger: Cloud Scheduler
    runner: Cloud Run Job
    frequency: 일 1회 새벽
    datasets: [지역 행사]
    design: Job 하나가 모든 동기화를 담당하고 데이터셋별 마지막 갱신 시각을 내부에서 판단한다
  realtime:
    datasets: [날씨, 대중교통 경로, 장소 키워드 검색]
  forbidden:
    - item: Spring @Scheduled
      reason: >-
        Cloud Run은 요청이 없으면 인스턴스를 0으로 축소하므로 스케줄러가 실행될 인스턴스가 존재하지 않는다.
        동기화가 조용히 멈춘다

open_items:
  - {id: A-02, question: 데이터셋별 다운로드 원본 형식과 적재 스크립트 위치}
  - {id: A-03, question: AI 기능을 독립 FastAPI 서비스로 배포할지 API 서버와 같은 실행 단위에 둘지}
  - {id: A-04, question: 그룹장이 참여자가 남은 그룹 여행에서 나가려 할 때 승계 또는 이탈 제한을 어떻게 처리할지}
  - {id: A-05, question: 그룹 여행 초대 링크의 만료 시간과 재발급 및 폐기 정책}
