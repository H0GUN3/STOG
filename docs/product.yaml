tuning_parameters:
  note: 코드에 상수로 박지 않고 설정값으로 분리한다. 실사용 데이터 확보 후 재조정 대상이다
  items:
    - {key: cell_transition_confirm, initial: 2, meaning: 셀 전환으로 인정하기 위한 연속 감지 횟수}
    - {key: location_distance_filter_m, initial: 50, meaning: 위치 콜백을 받는 최소 이동 거리}
    - {key: location_initial_zoom, initial: 15.0, meaning: 권한 승인 후 재진입 시 현재 위치에 적용하는 지도 확대 수준}
    - {key: event_nearby_radius_m, initial: 10000, meaning: 현재 위치 주변 행사 추천 반경}
    - {key: event_refresh_horizon_days, initial: 90, meaning: 행사 동기화에서 현재부터 조회할 미래 일수}
    - {key: event_nearby_result_limit, initial: 10, meaning: 행사 주변 추천의 최대 결과 수}
    - {key: dormant_after_minutes, initial: 60, meaning: 셀 전환 없이 휴면으로 전환되기까지의 시간}
    - {key: visit_dwell_minutes, initial: 30, meaning: 방문으로 인정하기 위한 체류 시간}
    - {key: walk_speed_limit_kmh, initial: 6, meaning: 실선 보간을 허용하는 평균 속도 상한}
    - {key: auth_access_token_minutes, initial: 15, meaning: STOG Access Token 유효 시간}
    - {key: auth_refresh_token_days, initial: 30, meaning: STOG Refresh Token 유효 기간}
    - {key: naver_login_ticket_minutes, initial: 5, meaning: 네이버 인증 완료 후 Android가 STOG 토큰으로 교환할 수 있는 1회용 ticket 유효 시간}
    - {key: catalog_search_result_limit, initial: 20, meaning: 한 번의 local-first 장소 검색에서 반환하는 최대 결과 수}
    - {key: catalog_search_default_radius_meters, initial: 3000, meaning: 좌표만 제공된 local-first 장소 검색의 Google Places location bias 기본 반경, 기존 API example radius를 configuration으로 승격한다}
    - {key: catalog_search_fallback_min_results, initial: 3, meaning: Google Places fallback을 호출하지 않고 충족해야 하는 local catalog 결과 수}
    - {key: catalog_search_fuzzy_threshold, initial: 0.25, meaning: pg_trgm lexical fuzzy 후보를 포함하는 최소 similarity}
    - {key: home_place_nearby_radius_m, initial: 5000, meaning: 홈에서 현재 위치 주변 장소를 조회하는 반경}
    - {key: home_place_result_limit, initial: 8, meaning: 홈의 장소 추천 카드 최대 결과 수}
    - {key: nearby_place_duplicate_distance_m, initial: 50, meaning: 주변 장소 결과에서 정규화된 이름이 같고 좌표가 이 거리 이내인 후보를 하나로 합치는 거리}
    - {key: place_merge_distance_m, initial: 50, meaning: normalized name·address와 provider 근거가 모두 일치하는 중복 장소의 자동 병합 허용 좌표 거리}
    - {key: late_visit_grace_hours, initial: 24, meaning: ended_at 전에 관측이 끝난 오프라인 방문을 여행 종료 후 수신할 수 있는 시간}
    - {key: feed_page_size, initial: 20, meaning: feed cursor 페이지의 기본이자 최대 결과 수}
    - {key: cell_summary_page_size, initial: 20, meaning: cells summary cursor 페이지의 기본이자 최대 결과 수}
    - {key: cell_photo_page_size, initial: 20, meaning: Cell photo response의 기본이자 최대 결과 수}
    - {key: camera_caption_max_code_points, initial: 120, meaning: Set Log 한 줄 기록의 최대 Unicode code point 수이며 줄바꿈은 허용하지 않는다}
    - {key: camera_thumbnail_max_bytes, initial: 51200, meaning: 촬영 기록 썸네일의 최대 업로드 바이트이며 signed storage 정책과 일치해야 한다}
    - {key: camera_location_max_age_seconds, initial: 15, meaning: 촬영 시점 위치 fix를 신뢰할 수 있는 최대 경과 시간}
    - {key: camera_location_max_accuracy_m, initial: 100, meaning: 촬영 시점 위치 fix에 허용하는 최대 수평 오차}
    - {key: camera_location_timeout_seconds, initial: 8, meaning: 셔터 후 정책에 맞는 foreground 위치 fix를 기다리는 최대 시간}
    - {key: home_location_max_age_seconds, initial: 60, meaning: 홈 주변 추천에 재사용할 수 있는 위치 fix의 최대 경과 시간}
    - {key: home_location_max_accuracy_m, initial: 500, meaning: 홈 주변 추천에 허용하는 최대 수평 오차}
    - {key: home_location_timeout_seconds, initial: 8, meaning: 홈 주변 추천 위치 fix를 기다리는 최대 시간}
    - {key: camera_place_radius_m, initial: 75, meaning: 촬영 좌표와 canonical 장소 후보를 연결하는 최대 거리}
    - {key: camera_place_tie_delta_m, initial: 10, meaning: 장소 후보 거리를 비교할 때 tie로 처리하는 거리 차이}

