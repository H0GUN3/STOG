meta:
  document: changelog
  project: STOG
  version: 0.1
description: 스펙 변경 이력. 최신 항목을 아래에 추가한다

changes:
  - "2026-08-31 | 여행 공개 범위를 public으로 고정 | 기존 private·group 여행을 public으로 전환하고 새 여행의 DB 기본값도 public으로 고정해 사진이 발견 피드 조건을 통과하도록 함. 사진 자체의 private·group visibility는 유지 | PRODUCT, BE, DB"
  - "2026-08-28 | 공개 여행 게시물을 발견 피드에 즉시 노출 | 공개 여행에 업로드한 게시물을 public 사진으로 정규화해 별도 public consent 없이 finalization 즉시 노출하고 moderation 승인과 active public grant는 요구하지 않으며 blocked 사진만 제외 | FE, BE, PRODUCT"
  - "2026-08-26 | 모든 APK target의 127.0.0.1 endpoint 영구 차단 | 127.0.0.1:8080을 포함한 loopback 주소를 phone·emulator 공통 Gradle fail-closed 경계에서 거부하고 emulator는 10.0.2.2:8080만 허용 | FE"
  - "2026-08-27 | 내 여행 목록을 일정 날짜 기준으로 분류 | 현재 날짜와 planned_start_date·planned_end_date를 비교해 예정·진행 중·지난 여행을 구분하고 위치 수집 mode와 화면 분류를 분리 | FE, PRODUCT"
  - "2026-08-27 | 로컬 백엔드 schema drift 및 장소 사진 매핑 복구 | canonical dev의 profile_image_key 누락을 V36 forward migration으로 복구하고 canonical photo_urls 매핑 컴파일 오류를 수정해 local runtime 기동과 장소 검색 계약을 회복 | BE, DB"
  - "2026-08-26 | 새 여행 생성 화면과 날짜 범위 바텀 시트 정비 | 새 여행 화면을 기준 디자인에 맞추고 날짜 카드를 누르면 화면을 유지한 채 어두운 스크림의 Modal Bottom Sheet에서 시작일·종료일을 두 번 선택하며, 이름 오류는 입력 상자 아래에 표시하고 대표 이미지 미선택 시 기존 기본 여행 이미지를 사용 | FE"
  - "2026-08-26 | 실기기 Android endpoint fail-closed 규칙 강화 | phone APK는 현재 public HTTPS backend·Quick Tunnel만 사용하고 emulator 전용 10.0.2.2는 emulator target에서만 허용하며 터널 hostname 변경 시 무시된 local endpoint를 갱신하고 재빌드하도록 고정 | FE, BE"
  - "2026-08-26 | 홈 주변 장소 추천 다양화·중복 제거 | 관광지 중심 요청을 문화·식음·숙박·쇼핑 유형까지 확장하고 사진 후보를 우선 노출하며 canonical·Google 간 같은 장소를 한 번만 반환 | PRODUCT, FE, BE"
  - "2026-08-27 | 사용자 화면 기능 중심 정리 | 저장한 피드·여행 성향 분석·알림 설정·고객센터·버전 정보 placeholder를 제거하고 실제 계정·프로필 사진·여행 요약·내 사진 Grid만 남겨 로딩·실패·빈 상태와 접근성 semantics를 보강 | FE, PRODUCT"
  - "2026-08-27 | 홈 주변 추천 위치 정책을 촬영 정책과 분리 | 촬영용 50m·15초 위치 검증은 유지하고 홈 장소·행사 추천에는 500m·60초 tuning을 적용해 일반 기기의 network 위치도 추천에 사용 | PRODUCT, FE"
  - "2026-08-26 | F-17 1단계 주변 행사 카드 활성화 | TOUR_API_SERVICE_KEY와 searchFestival2를 사용해 행사를 동기화하고 비로그인 /events/nearby와 기존 홈 PlaceCard event variant로 주변 행사만 노출하며 상세·알림은 후속으로 둔다 | PRODUCT, FE, BE, DB"
  - "2026-08-26 | 로그인 전 현재 위치 주변 장소 추천 연결 | 기존 위치 획득기·장소 검색 응답·장소 카드를 재사용하고 공개 canonical 장소를 거리순으로 먼저 반환한 뒤 Google Nearby로 부족한 수를 보충 | PRODUCT, FE, BE"
  - "2026-08-26 | 재사용 우선·Impact Analysis·수직 기능 완료 운영 규칙 추가 | 새 구조를 만들기 전 관련 구현과 caller를 검색하고 UI 요구를 DB까지 추적하며 KEEP·MERGE·DELETE·REFACTOR·NEW 중복 분류와 계층별 완료 보고를 의무화 | ALL"
  - "2026-08-25 | 발견 사진 피드에 댓글·저장 fixture 흐름 추가 | 발견 레퍼런스와 같은 SNS 리듬으로 보내기 action을 제거하고 좋아요·댓글·저장만 유지하며 사용자 화면에서 saved_feed를 확인하도록 Android 로컬 미리보기 범위를 확정 | PRODUCT, FE"
  - "2026-08-25 | 검색 장소 상세 액션과 지도 시트 구성을 재정의 | 공유·전화·길찾기·출발·도착 하단 액션을 제거하고 장소명 옆 bookmark 저장으로 통합하며 상세 시트 확장 시 하단 navigation을 숨김 | FE"
  - "2026-08-25 | F-12 공개 동선 피드 계약과 A-09 확정 | public ended trip 전용 feed, visit 기반 참여자별 ordered trail, trip like 멱등성, caller-selected destination trip/day copy와 user-scoped idempotency receipt를 확정 | PRODUCT, FE, BE, DB"
  - "2026-08-25 | P0/P1 planning, archive, capture-download, and review surfaces made explicit in architecture contracts | Added F-06/F-07/F-09/F-11/F-24 feature contracts, archive trail fields, user-triggered capture download, and backend review receipt ownership; explicit itinerary completion persistence remains deferred | FE, BE, DB, AI"
  - "2026-08-25 | P0/P1 승인 GCS bucket을 stog-media로 확정 | 기존 승인 lifecycle·infrastructure와 일치하도록 object storage target을 stog-media로 통일하고 standard ADC service-account impersonation으로 실제 검증 | BE, DB"
  - "2026-08-24 | 참여자별 기록과 visit 멱등 API 식별자 확정 | V18 catalog validation 복구와 V19 member recording schema를 순서대로 적용하고 PATCH /trips/{id}/collection-state 및 canonical visit fingerprint·409 code를 명시 | BE, DB"
  - "2026-08-24 | backend 자동 테스트 DB를 fail-closed로 격리 | Gradle 및 direct IDE/JUnit test는 test profile과 disposable stog_backend_test identity만 사용하고 다른 profile·runtime/Flyway URL·identity를 SQL connection 전에 거부하며 V10 restore-safety forward fix 전에는 test-only disposable schema compatibility boundary를 사용 | BE, DB"
  - "2026-08-24 | P0/P1 contract와 실행 경계 고정 | 참여자별 위치 수집, 불변 visit·basket_item 멱등성, 종료 후 24시간 visit, local-only share_import, local backend의 Cloud SQL stog_canonical·GCS 사용, agent 전용 정제 완료, owner-only 기기 검증을 명시하고 현재 정제 관광 catalog·places/place_details·출처/license 구조와 local-first Google fallback을 유지하며 더 넓은 catalog 저장 재설계와 Google fallback 일괄 적재를 P0/P1 이후로 연기 | PRODUCT, FE, BE, DB, AI"
  - "2026-08-24 | 장소 상세를 2단계 지도 Bottom Sheet로 재구성 | Default에서 핵심 정보와 4개 액션을 제공하고 Expanded에서 사진·기본 정보·요일별 영업시간과 고정 6개 액션을 제공하며 Google request-time 평점·리뷰·영업 상태는 상세 표시 전용으로 사용 | FE, BE"
  - "2026-08-24 | canonical 장소 정제·기능 category·Cell 참여 경계 확정 | agent가 local stog_canonical_dev V17에서 backup·dry-run 뒤 DML 정제를 수행하고 일반 장소는 좌표만 보존하며 공식 지역 특색 근거가 있는 장소만 Cell에 참여 | PRODUCT, BE, DB, AI"
  - "2026-08-23 | 여행 목록과 일정 workspace를 실제 API 흐름으로 통합 | 내 여행 화면이 인증된 trip 목록·basket·itinerary를 사용하고 장소 검색에서 새 여행을 만들 때 날짜 범위를 함께 저장 | FE, BE"
  - "2026-08-23 | 성향 backend와 여행 날짜 편집 범위 확정 | 초기 설문 UI와 점수 판정 검증 및 추천·AI 일정 연결은 후속으로 미루고 Preference·Travel Style·Trip Context 저장 API와 선택한 여행의 날짜별 일정 편집을 우선한다 | FE, BE, AI"
  - "2026-08-23 | 사용자 성향을 Preference·Travel Style·Trip Context로 재구성 | 6개 장기 Preference와 7개 장기 Travel Style을 0~1 점수로 분리하고 현재 여행 조건은 trip-scoped context로만 저장하며 단일 traveler_type 판정을 제거 | PRODUCT, BE, AI"
  - "2026-08-22 | 장소 원본 권리 경계와 공개 Cell 적격성 고정 | TOUR_API·AREA_RESTAURANT만 초기 canonical import에 사용하고 KAKAO_LOCAL은 권리 확인 전 제외하며 TOUR_CULTURE·TOUR_HISTORY·TOUR_NATURE·TOUR_EXPERIENCE와 유효한 license provenance를 통과한 장소만 public_cell_eligible로 Cell에 집계하고 일반 음식점·숙소는 검색·상세·사용자 활동으로 제한 | BE, DB, AI"
  - "2026-08-21 | 밝은 앱 표면을 순백색으로 통일 | Android의 StogCanvas·StogSurface와 XML canvas 색상에서 아이보리·크림 계열을 제거하고 흰색 하나로 통일하며 노란색은 강조 상태에만 유지 | FE"
  - "2026-08-21 | 발견 피드를 전용 SNS 전체 화면으로 분리 | 하단 발견 항목이 지도 bottom sheet를 교체하던 구조를 제거하고 작성자·사진·좋아요·캡션 순서의 피드로 전환하며 중복 공개 상태 문구와 다시 시도 action을 제거 | FE"
  - "2026-08-21 | 홈 실행·내 여행 계획 관리·STOBEE 맥락 분리 | 여행 없음·예정·여행 중·완료 홈 상태, 전용 내 여행 목록과 일정 workspace, 완료 일정 접기, trip_id 기반 proposal 확인 흐름을 FE 우선으로 정의하고 실제 저장·이동시간·대화 API는 후속 backend 계약으로 기록 | FE, BE, DB, AI"
  - "2026-08-20 | isolated C-drive local PostgreSQL endpoint | canonical local PostgreSQL 18.4 target is C:\\STOG\\postgresql\\data on localhost:55432 with separate migrator/runtime roles; the original /var/lib PostgreSQL cluster remains untouched | BE, DB"
  - "2026-08-20 | catalog·search·photo·SNS·Cell canonical contract 정리 | native PostgreSQL 18.4 on C:와 pg_trgm lexical search를 기준으로 licensed catalog, public photo grant, moderation, feed, viewer-scoped Cell response를 정의하고 embedding·pgvector·image similarity·F-17 events는 deferred로 유지 | FE, BE, DB, AI"
  - "2026-08-20 | 장소 검색을 지도 시트에서 독립 전체 화면으로 분리 | 지도 상단 검색을 누르면 바텀 시트 상태를 바꾸지 않고 research1·research2 기준의 전용 검색 화면으로 전환하며 결과 marker는 지도 복귀 후 유지 | FE"
  - "2026-08-19 | 장소 검색과 내 여행 화면 책임 분리 | 지도 상단 검색은 게스트에게도 공개하고 담기에서만 로그인과 여행 선택을 요구하며 내 여행은 검색 없이 여행·일정 바구니·일정 항목 관리에 집중하고 결과는 STOG 장소 카드와 지도 표시로 즉시 제공 | FE, BE, DB"
  - "2026-08-19 | 사진 metadata·owner 권한 계약 확정 | original·thumbnail signed URL 두 개를 발급하고 H3-10·visibility를 local canonical schema에 저장하며 trip owner만 생성·조회·변경하고 group 권한은 trip_members 계약 뒤에 확장 | BE, DB"
  - "2026-08-19 | Cloud UUID 사용자 매핑 방식 확정 | 기존 Cloud UUID를 source_user_mappings에 보존하고 canonical users.id를 참조하며 Cloud import는 별도 승인 뒤에만 수행 | BE, DB"
  - "2026-08-19 | local completion audit 기록 | Cloud fixture H3-10 compatibility, owner-scoped planning, three-state 지도 sheet, provider boundary, and integrated local verification을 완료 기록하고 Routes·Naver·Cloud write 외부 gate를 명시 | FE, BE, DB"
  - "2026-08-18 | 지도 계획 시트 세 상태 계약으로 변경 | Google 지도 위 Kakao 지도 스타일 persistent draggable bottom sheet를 collapsed·half expanded·expanded 세 상태와 상단 중앙 핸들로 고정하고 지도 맥락을 모든 상태에서 유지 | FE"
  - "2026-08-18 | Google 지도 credential 경계와 Naver Android App Link deferral 정리 | MAPS_API_KEY manifest 주입과 Places·Routes backend-only 분리를 canonical 계약에 맞추고 Kakao를 소셜·공유 담기 역할로 한정하며 외부 App Link gate 전 Naver Android 진입을 비활성화 | FE, BE"
  - "2026-08-18 | Google Maps Android 키 주입 수정 | secrets.properties의 MAPS_API_KEY를 manifest placeholder에 연결하고 Android Maps 타일 렌더링을 실기기에서 재확인 | FE"
  - "2026-08-18 | 기존 여행 선택 흐름 추가 | 인증된 GET /trips/me owner-scoped 목록을 지도 계획 시트에 표시하고 선택한 trip_id를 장소 검색·바구니 담기에 사용하며 새 여행 생성도 유지 | FE, BE"
  - "2026-08-18 | Android 지도 계획 시트 패턴 확정 | Google 지도 위 공통 바텀 모달 시트에서 여행 생성·장소 검색·바구니 담기를 제공하고 부분/전체 펼침, 공통 카드와 완료 상태를 적용 | FE"
  - "2026-08-18 | canonical planning local slice 추가 | V6에서 trips·places·basket_items를 만들고 소유 여행에 Google 후보를 확인해 H3-10을 계산한 resolved basket item을 저장하며 cloud/prod 자동 migration은 비활성화 | FE, BE, DB"
  - "2026-08-18 | canonical 계획·사진 target 재확인 | 장소 확인은 basket_items를 사용하고 사진 cell_id는 좌표에서 계산한 nullable H3 resolution 10을 사용하며 기존 Cloud UUID/H3-11 데이터는 read-only source로 유지 | FE, BE, DB"
  - "2026-08-18 | GCS signed PUT URL 경계 추가 | Backend가 object key를 생성하고 Android는 gcs-write profile에서만 발급되는 V4 signed URL로 직접 업로드하며 기본 profile은 비활성 | FE, BE"
  - "2026-08-18 | Google 장소 Cloud SQL upsert 경계를 cloud-write profile 뒤에 격리 | 기본 local·cloud·prod 실행에서는 비활성화하고 기존 행의 정보는 보존하며 provider/external_id unique 충돌만 안전하게 처리 | BE, DB"
  - "2026-08-18 | 기존 Cloud SQL source schema의 read-only 호환 경계 추가 | travel_items와 external refs를 우선 매핑하고 H3 resolution 11은 보존한 채 canonical resolution 10을 좌표에서 별도 계산하며 Cloud write는 승인 전 금지 | BE, DB"
  - "2026-08-18 | Google Maps·Places API (New)·Routes API를 신규 지도·장소·동선 provider로 확정 | Android 지도는 Google을 사용하고 Kakao는 로그인·공유 입력 인식으로 유지하며 Google API key는 Backend 환경변수로만 사용 | FE, BE, DB"
  - "2026-08-18 | 소셜 제공자별 별도 users 생성 허용 | 계정 연결이나 자동 병합 없이 Google·Kakao·Naver 로그인을 독립 계정으로 유지 | FE, BE, DB"
  - "2026-08-18 | 서버 소유 네이버 OAuth callback과 1회용 ticket 구현 | state 검증 후 네이버 code 교환·프로필 조회를 수행하고 Android 복귀 시 JWT 대신 hash 저장 ticket만 전달 | BE, FE"
  - "2026-08-18 | Cloud SQL Auth Proxy 확인 profile 추가 | local을 기본으로 유지하고 cloud profile은 localhost 5433의 stog_0 읽기 확인 및 승인된 migration에만 사용 | BE, DB"
  - "2026-08-18 | STOG 인증 token 만료와 rotation 계약 확정 | Access 15분, Refresh 30일, 네이버 ticket 5분으로 두고 Refresh와 ticket은 hash만 저장하며 재발급 시 이전 Refresh를 즉시 폐기 | BE, DB"
  - "2026-08-18 | 로컬과 Cloud SQL 실행 profile 분리 | 로컬 PostgreSQL에서 Flyway를 먼저 검증하고 운영은 같은 migration을 Cloud Run 환경변수로 적용하며 기존 Cloud DB는 초기화하지 않음 | BE, DB"
